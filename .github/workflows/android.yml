name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME）；这里只把许可同意掉，
      # 平台/构建工具由 AGP 自行补齐。
      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaowanggu-trainer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Assemble Release (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yaowanggu-trainer-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
