name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME）；这里只把许可同意掉，
      # 平台/构建工具由 AGP 自行补齐。
      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaowanggu-trainer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Assemble Release (placeholder-signed)
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release signature
        run: |
          APKSIGNER="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yaowanggu-trainer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -name '*.apk' -exec cp {} out/ \;
          ls -la out
          test -n "$(ls -A out)"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: docs/RELEASE-NOTES-${{ github.ref_name }}.md
          files: |
            out/*.apk
          fail_on_unmatched_files: true
